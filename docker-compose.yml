# YourTrolley -- app (SQLite) + Caddy (automatic HTTPS).
#
# Quick start:
#   1. cp .env.example .env   and fill in real values (see README.md)
#   2. touch db.sqlite3       (so Docker can bind-mount it as a file)
#   3. docker compose up -d --build
#   4. docker compose exec app python manage.py createsuperuser
#
# Caddy automatically requests and renews HTTPS certificates for the
# domain(s) you set in the Caddyfile, as long as your DNS already points
# at this server and ports 80/443 are reachable.
#
# Want PostgreSQL instead of SQLite? See the "Switching this Docker setup
# to PostgreSQL" section in README.md -- it's a small, well-documented
# change to this file plus uncommenting the Postgres block in
# config/settings.py.

services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # SQLite database file, bind-mounted from the host so your data
      # survives container rebuilds. Run `touch db.sqlite3` on the host
      # once before first `docker compose up` so this file exists.
      - ./db.sqlite3:/app/db.sqlite3
      - media_data:/app/media
      - static_data:/app/staticfiles
      - logs_data:/app/logs
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  media_data:
  static_data:
  logs_data:
  caddy_data:
  caddy_config:
