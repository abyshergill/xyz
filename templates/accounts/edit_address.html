{% extends "base.html" %}
{% block title %}Edit Address{% endblock %}
{% block content %}
<div class="max-w-md mx-auto card">
    <h1 class="text-xl font-bold mb-4">Edit Address</h1>
    <form method="post" novalidate>
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
            <label class="block text-sm font-medium mb-1">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}<p class="text-red-600 text-xs">{{ error }}</p>{% endfor %}
        </div>
        {% endfor %}
        <div class="flex gap-2">
            <button type="submit" class="btn">Save Address</button>
            <a href="{% url 'accounts:profile' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
