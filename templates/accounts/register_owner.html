{% extends "base.html" %}
{% block title %}Register Your Stall{% endblock %}
{% block content %}

<div class="max-w-lg mx-auto card">

  <h1 class="text-xl font-bold mb-4">Register Your Food Stall</h1>

  <!-- Normal Owner Registration -->
  <form method="post" novalidate>
    {% csrf_token %}

    {% for field in form %}
      <div class="mb-3">
        <label class="block text-sm font-medium mb-1">
          {{ field.label }}
          {% if field.field.required %} *{% endif %}
        </label>

        {{ field }}

        {% for error in field.errors %}
          <p class="text-red-600 text-xs mt-1">{{ error }}</p>
        {% endfor %}
      </div>
    {% endfor %}

    <button type="submit" class="btn w-full">
      Create Owner Account
    </button>
  </form>


  <!-- Divider -->
  <div class="my-5 flex items-center gap-3">
    <div class="flex-1 border-t border-gray-200"></div>
    <span class="text-xs font-medium text-gray-400 uppercase">
      or
    </span>
    <div class="flex-1 border-t border-gray-200"></div>
  </div>


  <!-- Google Owner Login -->
  <form method="post" action="{% url 'accounts:login_shop_owner' %}">
    {% csrf_token %}

    <button
      type="submit"
      class="w-full flex items-center justify-center gap-3 border border-gray-300 bg-white text-gray-700 font-medium py-2.5 px-4 rounded-lg hover:bg-gray-50 hover:border-gray-400 transition duration-150"
    >

      <!-- Google Logo -->
      <svg
        class="w-5 h-5 flex-shrink-0"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path
          fill="#4285F4"
          d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31-1.17.78-2.66 1.24-4.42 1.24-3.4 0-6.29-2.3-7.32-5.4H2.18v3.27C3.99 20.53 7.7 23 12 23c2.97 0 5.46-.98 7.28-2.66 1.82-1.68 3.28-4.74 3.28-8.09z"
        />
        <path
          fill="#34A853"
          d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-3.4 0-6.29-2.3-7.32-5.4H2.18v3.27C3.99 20.53 7.7 23 12 23z"
        />
        <path
          fill="#FBBC05"
          d="M4.68 14.17c-.23-.65-.36-1.34-.36-2.17s.13-1.52.36-2.17V6.56H2.18C1.43 8.04 1 9.71 1 11.5s.43 3.46 1.18 4.94l2.5-2.27z"
        />
        <path
          fill="#EA4335"
          d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"
        />
      </svg>

      <span>Continue with Google as Shop Owner</span>

    </button>
  </form>

</div>

{% endblock %}
